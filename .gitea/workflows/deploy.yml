name: Build and Deploy (Alpine)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: Alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to /home/blog/web/
        env:
          TARGET_DIR: /home/blog/web
        run: |
          set -euo pipefail

          if [ -z "${TARGET_DIR}" ]; then
            echo "TARGET_DIR is empty" >&2
            exit 1
          fi
          if [ "${TARGET_DIR}" = "/" ]; then
            echo "Refusing to deploy to /" >&2
            exit 1
          fi
          case "${TARGET_DIR}" in
            /home/blog/web|/home/blog/web/)
              ;;
            *)
              echo "Refusing to deploy to unexpected path: ${TARGET_DIR}" >&2
              exit 1
              ;;
          esac

          if [ ! -d dist ]; then
            echo "dist/ not found; build may have failed" >&2
            exit 1
          fi

          mkdir -p "${TARGET_DIR}"

          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete dist/ "${TARGET_DIR}/"
          else
            echo "rsync not found; falling back to rm + cp" >&2
            rm -rf "${TARGET_DIR}"/*
            cp -a dist/. "${TARGET_DIR}/"
          fi
