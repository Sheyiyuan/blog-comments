name: Build and Deploy (Alpine)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: Alpine

    steps:
      - name: Install runner prerequisites (Node for actions)
        shell: sh
        run: |
          set -e

          if command -v apk >/dev/null 2>&1; then
            ALPINE_VER="$(cut -d. -f1,2 /etc/alpine-release)"
            printf '%s\n' \
              "https://mirrors.aliyun.com/alpine/v${ALPINE_VER}/main" \
              "https://mirrors.aliyun.com/alpine/v${ALPINE_VER}/community" \
              > /etc/apk/repositories
            apk update

            # Always ensure git/rsync are present.
            apk add --no-cache git rsync

            # Ensure Node.js is present and sufficiently new for JS-based actions.
            if command -v node >/dev/null 2>&1; then
              node -v
              NODE_MAJOR="$(node -p 'process.versions.node.split(".")[0]')"
              if [ "${NODE_MAJOR}" -lt 18 ]; then
                echo "Node.js >= 18 is required to run JS-based actions. Current: $(node -v)" >&2
                echo "Please upgrade Node.js on the runner (or remove the old one so apk-installed node can be used)." >&2
                exit 1
              fi
            else
              apk add --no-cache nodejs npm || apk add --no-cache nodejs-current npm
              node -v
            fi

            # Ensure npm exists for installing pnpm.
            if ! command -v npm >/dev/null 2>&1; then
              apk add --no-cache npm
            fi
          else
            echo "Node.js is required on the runner to execute JS-based actions (checkout/setup-node/cache)." >&2
            echo "This runner is not Alpine (apk not found). Please install Node.js (>=18 is enough to run actions) and retry." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm (npm mirror)
        shell: sh
        run: |
          set -euo pipefail

          npm config set registry https://registry.npmmirror.com
          npm i -g pnpm@9
          pnpm -v

          # Keep pnpm store inside workspace for easy caching
          pnpm config set store-dir .pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Astro/Vite build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .astro
            node_modules/.vite
          key: ${{ runner.os }}-astro-vite-${{ hashFiles('pnpm-lock.yaml', 'astro.config.mjs', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-astro-vite-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-astro-vite-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to /home/blog/web/
        env:
          TARGET_DIR: /home/blog/web
        run: |
          echo "[deploy] uname: $(uname -a)"
          echo "[deploy] id: $(id)"

          IN_CONTAINER=0
          if [ -f /.dockerenv ]; then IN_CONTAINER=1; fi
          if [ -r /proc/1/cgroup ] && grep -E "docker|containerd|kubepods|podman" /proc/1/cgroup >/dev/null 2>&1; then IN_CONTAINER=1; fi
          if [ "${IN_CONTAINER}" -eq 1 ]; then
            echo "[deploy] detected: containerized execution"
            if command -v mount >/dev/null 2>&1; then
              if mount | grep -F " on ${TARGET_DIR} " >/dev/null 2>&1; then
                echo "[deploy] ${TARGET_DIR} is a mount point (likely host bind-mount)."
              else
                echo "[deploy] WARNING: ${TARGET_DIR} is not a mount point inside container; writes may not reach the host filesystem." >&2
              fi
            fi
          else
            echo "[deploy] detected: host execution"
          fi

          if command -v df >/dev/null 2>&1; then
            df -h "${TARGET_DIR}" || true
          fi
          set -euo pipefail

          echo "[deploy] runner: $(uname -a)"
          echo "[deploy] target: ${TARGET_DIR}"
          echo "[deploy] pwd: $(pwd)"

          if [ -z "${TARGET_DIR}" ]; then
            echo "TARGET_DIR is empty" >&2
            exit 1
          fi
          if [ "${TARGET_DIR}" = "/" ]; then
            echo "Refusing to deploy to /" >&2
            exit 1
          fi
          case "${TARGET_DIR}" in
            /home/blog/web|/home/blog/web/)
              ;;
            *)
              echo "Refusing to deploy to unexpected path: ${TARGET_DIR}" >&2
              exit 1
              ;;
          esac

          if [ ! -d dist ]; then
            echo "dist/ not found; build may have failed" >&2
            exit 1
          fi

          echo "[deploy] dist preview:"
          ls -al dist | sed -n '1,200p'

          mkdir -p "${TARGET_DIR}"

          echo "[deploy] target before sync:"
          ls -al "${TARGET_DIR}" || true

          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete dist/ "${TARGET_DIR}/"
          else
            echo "rsync not found; falling back to rm + cp" >&2
            rm -rf "${TARGET_DIR}"/*
            cp -a dist/. "${TARGET_DIR}/"
          fi

          echo "[deploy] target after sync:"
          ls -al "${TARGET_DIR}" | sed -n '1,200p'

          if [ -z "$(ls -A "${TARGET_DIR}" 2>/dev/null || true)" ]; then
            echo "[deploy] ERROR: target directory is empty after deploy." >&2
            echo "[deploy] This often means the job is running inside a container without /home/blog/web mounted from the host." >&2
            exit 1
          fi
